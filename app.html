<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f5f4">
<title>Campus Notes</title>
<script>document.documentElement.dataset.theme = localStorage.getItem('cnTheme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m8 12 3 3 5-6"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
</svg>
<div class="cn-shell">
  <aside class="cn-side">
    <div class="cn-brand"><span class="cn-logo"><svg class="ico"><use href="#i-book"/></svg></span>Campus Notes</div>
    <nav id="cnNav" aria-label="Main">
      <a href="#/dashboard" data-r="dashboard"><svg class="ico"><use href="#i-home"/></svg><span>Dashboard</span></a>
      <a href="#/notes" data-r="notes"><svg class="ico"><use href="#i-note"/></svg><span>Notes</span></a>
      <a href="#/tasks" data-r="tasks"><svg class="ico"><use href="#i-check"/></svg><span>Tasks</span></a>
      <a href="#/timetable" data-r="timetable"><svg class="ico"><use href="#i-cal"/></svg><span>Timetable</span></a>
      <a href="#/resources" data-r="resources"><svg class="ico"><use href="#i-book"/></svg><span>Resources</span></a>
    </nav>
    <div class="cn-sec">Subjects</div>
    <div class="cn-folders" id="cnFolders"></div>
    <div class="cn-side-foot">Your notes are saved on this device.</div>
  </aside>
  <div class="cn-main">
    <header class="cn-top">
      <h1 id="cnTitle">Dashboard</h1>
      <div class="cn-user">
        <span class="chip" id="cnUsage" title="Time used today"><svg class="ico"><use href="#i-clock"/></svg><span>0m</span></span>
        <button class="chip icon-btn" id="cnTheme" type="button" aria-label="Toggle dark mode"><svg class="ico"><use href="#i-moon"/></svg></button>
        <a class="chip" href="account.html" id="cnAccount"><svg class="ico"><use href="#i-user"/></svg><span class="lbl">Account</span></a>
        <button class="chip" id="cnLogout" type="button"><svg class="ico"><use href="#i-out"/></svg><span class="lbl">Logout</span></button>
      </div>
    </header>
    <main id="cnView"></main>
  </div>
</div>
<script src="https://static.zohocdn.com/catalyst/sdk/js/4.5.0/catalystWebSDK.js"></script>
<script src="https://quickguide-60034244588.development.catalystserverless.in/__catalyst/sdk/init.js"></script>
<script src="js/app.js"></script>
</body>
</html>
