<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Usage Stats &mdash; Cheatsheets</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    main { max-width: 1000px; margin: 0 auto; padding: 1.5rem; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 2rem; font-size: 0.9rem; }
    th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--h2-border); }
    .row { display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem; }
  </style>
</head>
<body>
<main>
  <h1>📊 Usage Stats</h1>
  <div class="row">
    <a href="index.html">← Back</a>
    <label>Days <select id="days"><option>7</option><option selected>30</option><option>90</option></select></label>
    <button id="cleanup">Delete data older than 90 days</button>
  </div>
  <div id="out">Loading…</div>
</main>
<script src="js/header.js"></script>
<script>
  const API = location.hostname.endsWith("catalystserverless.in") ? "/server/doc_api" : "https://quickguide-60034244588.development.catalystserverless.in/server/doc_api";
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const dur = s => { s = Number(s) || 0; const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}h ${m}m` : `${m}m ${s % 60}s`; };
  // ZCQL aggregate rows look like { LoginLog: { login_date, 'COUNT(ROWID)' } }
  const flat = rows => rows.map(r => Object.assign({}, ...Object.values(r)));
  const tbl = (head, rows) => `<table><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${head.length}">No data</td></tr>`}</table>`;

  function load() {
    fetch(`${API}/stats?days=${document.getElementById('days').value}`, { credentials: 'include' })
      .then(r => r.ok ? r.json() : Promise.reject(r.status === 403 ? 'Admin only' : 'Failed to load'))
      .then(d => {
        const val = (o, k) => o[k] ?? o[Object.keys(o).find(x => x.startsWith(k))];
        document.getElementById('out').innerHTML =
          '<h2>Daily logins (unique users)</h2>' + tbl(['Date', 'Users'], flat(d.logins).map(r => [r.login_date, val(r, 'COUNT')])) +
          '<h2>Time used per user</h2>' + tbl(['User ID', 'Active time'], flat(d.perUser).map(r => [r.user_id, dur(val(r, 'SUM'))])) +
          '<h2>Time used per page</h2>' + tbl(['Page', 'Active time', 'Views'], flat(d.perPage).sort((a, b) => val(b, 'SUM') - val(a, 'SUM')).map(r => [r.page, dur(val(r, 'SUM')), val(r, 'COUNT')])) +
          '<h2>Recent logins</h2>' + tbl(['Email', 'Date', 'Time', 'IP', 'Browser'], flat(d.recent).map(r => [r.email, r.login_date, r.login_time, r.ip, (r.user_agent || '').slice(0, 60)]));
      })
      .catch(e => { document.getElementById('out').textContent = e; });
  }
  document.getElementById('days').addEventListener('change', load);
  document.getElementById('cleanup').addEventListener('click', () => {
    if (!confirm('Permanently delete tracking data older than 90 days?')) return;
    fetch(`${API}/cleanup`, { method: 'POST', credentials: 'include' }).then(r => r.json()).then(r => alert('Done, cutoff ' + r.cutoff)).then(load);
  });
  load();
</script>
</body>
</html>
