<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Account &mdash; Cheatsheets</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    main { max-width: 1000px; margin: 0 auto; padding: 1.5rem; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 2rem; font-size: 0.9rem; }
    th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--h2-border); }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: .8rem; margin-bottom: 2rem; }
    .card { border: 1px solid var(--h2-border); border-radius: 10px; padding: .8rem; }
    .card b { display: block; font-size: 1.3rem; }
    .up { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
  </style>
</head>
<body>
<main>
  <h1>👤 My Account</h1>
  <p><a href="index.html">← Back</a></p>
  <div id="out">Loading…</div>

  <h2>📁 My Files</h2>
  <p><small>Private to you. Allowed: pdf, png, jpg, txt, md, zip, docx · max 10 MB.</small></p>
  <div class="up">
    <input type="file" id="file" accept=".pdf,.png,.jpg,.jpeg,.txt,.md,.zip,.docx" />
    <button id="upload">Upload</button>
    <span id="upMsg"></span>
  </div>
  <table><thead><tr><th>File</th><th>Size</th><th>Uploaded</th><th></th></tr></thead><tbody id="files"><tr><td colspan="4">Loading…</td></tr></tbody></table>
</main>
<script src="js/header.js"></script>
<script>
  const API = location.hostname.endsWith("catalystserverless.in") ? "/server/doc_api" : "https://quickguide-60034244588.development.catalystserverless.in/server/doc_api";
  const MAX = 10 * 1024 * 1024, EXT = ['pdf','png','jpg','jpeg','txt','md','zip','docx'];
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const dur = s => { s = Number(s) || 0; const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}h ${m}m` : `${m}m ${s % 60}s`; };
  const size = n => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.ceil(n / 1024) + ' KB';
  const call = (p, o = {}) => fetch(API + p, { credentials: 'include', ...o }).then(async r => {
    const b = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(b.error || r.statusText);
    return b;
  });
  const rows = (list, cols) => list.length ? list.map(r => '<tr>' + cols.map(c => `<td>${c(r)}</td>`).join('') + '</tr>').join('')
    : `<tr><td colspan="${cols.length}">No data yet.</td></tr>`;

  function loadAccount() {
    call('/account').then(d => {
      const p = d.profile;
      const totalSec = d.timePerPage.reduce((a, r) => a + Number(r['SUM(active_seconds)'] || 0), 0);
      const today = new Date().toISOString().slice(0, 10);
      const todaySec = (d.timePerDay.find(x => x.date === today) || {}).seconds || 0;
      document.getElementById('out').innerHTML = `
        <div class="cards">
          <div class="card">Login days<b>${d.totalLoginDays}</b></div>
          <div class="card">Time today<b>${dur(todaySec)}</b></div>
          <div class="card">Total time<b>${dur(totalSec)}</b></div>
          <div class="card">Last login<b style="font-size:1rem">${esc((d.logins[0] || {}).login_time || '—')}</b></div>
        </div>
        <h2>Profile</h2>
        <table><tbody>
          <tr><th>Name</th><td>${esc((p.first_name + ' ' + p.last_name).trim() || '—')}</td></tr>
          <tr><th>Email</th><td>${esc(p.email)}</td></tr>
          <tr><th>Role</th><td>${esc(p.role)}</td></tr>
          <tr><th>Status</th><td>${esc(p.status)} ${p.confirmed ? '✅ confirmed' : '⚠️ not confirmed'}</td></tr>
          <tr><th>User ID</th><td>${esc(p.user_id)}</td></tr>
          <tr><th>Org ID</th><td>${esc(p.org_id || '—')}</td></tr>
          <tr><th>Created</th><td>${esc(p.created || '—')}</td></tr>
          <tr><th>Time zone / locale</th><td>${esc(p.timezone || '—')} / ${esc(p.locale || '—')}</td></tr>
        </tbody></table>
        <h2>Daily logins (last 30)</h2>
        <table><thead><tr><th>Date</th><th>Time</th><th>IP</th><th>Browser</th></tr></thead><tbody>
          ${rows(d.logins, [r => esc(r.login_date), r => esc(r.login_time), r => esc(r.ip), r => `<small>${esc(String(r.user_agent || '').slice(0, 80))}</small>`])}
        </tbody></table>
        <h2>Time used per day (30 days)</h2>
        <table><thead><tr><th>Date</th><th>Active time</th></tr></thead><tbody>
          ${rows(d.timePerDay, [r => esc(r.date), r => dur(r.seconds)])}
        </tbody></table>
        <h2>Time per page</h2>
        <table><thead><tr><th>Page</th><th>Visits</th><th>Active time</th></tr></thead><tbody>
          ${rows(d.timePerPage, [r => esc(r.page), r => esc(r['COUNT(ROWID)']), r => dur(r['SUM(active_seconds)'])])}
        </tbody></table>`;
    }).catch(e => { document.getElementById('out').textContent = 'Could not load account: ' + e.message; });
  }

  function loadFiles() {
    call('/my-files').then(d => {
      const tb = document.getElementById('files');
      tb.innerHTML = rows(d.items, [
        r => `<a href="#" data-dl="${esc(r.ROWID)}">📄 ${esc(r.file_name)}</a>`,
        r => size(Number(r.size) || 0), r => esc(r.CREATEDTIME),
        r => `<button data-del="${esc(r.ROWID)}">✕</button>`]);
    }).catch(() => {});
  }

  document.getElementById('files').addEventListener('click', e => {
    const dl = e.target.closest('[data-dl]'), del = e.target.closest('[data-del]');
    if (dl) { e.preventDefault(); call(`/attachments/${dl.dataset.dl}/download`).then(r => window.open(r.url, '_blank', 'noopener')).catch(err => alert(err.message)); }
    if (del && confirm('Delete this file?')) call(`/my-files/${del.dataset.del}`, { method: 'DELETE' }).then(loadFiles).catch(err => alert(err.message));
  });

  document.getElementById('upload').addEventListener('click', () => {
    const f = document.getElementById('file').files[0], msg = document.getElementById('upMsg');
    if (!f) return (msg.textContent = 'Choose a file first.');
    if (f.size > MAX) return (msg.textContent = 'File exceeds 10 MB.');
    if (!EXT.includes((f.name.split('.').pop() || '').toLowerCase())) return (msg.textContent = 'File type not allowed.');
    msg.textContent = 'Uploading…';
    call('/my-files', { method: 'POST', headers: { 'Content-Type': 'application/octet-stream', 'X-File-Name': encodeURIComponent(f.name) }, body: f })
      .then(() => { msg.textContent = '✅ Uploaded'; document.getElementById('file').value = ''; loadFiles(); })
      .catch(err => { msg.textContent = '❌ ' + err.message; });
  });

  loadAccount();
  loadFiles();
</script>
</body>
</html>
